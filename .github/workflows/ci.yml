name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-notebooks:
    name: "Test Pluto Notebooks — Julia ${{ matrix.julia-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11']
        language: ['pt-br', 'en', 'es']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Install dependencies
        run: |
          julia --project -e '
              using Pkg
              Pkg.instantiate()
          '

      - name: Test notebooks with Pluto
        run: |
          julia --project -e '
              using Pluto
              notebooks_dir = joinpath("notebooks", $(repr(${{ matrix.language }})))
              notebook_files = sort(filter(f -> endswith(f, ".jl"), readdir(notebooks_dir)))

              if isempty(notebook_files)
                  error("No notebooks found in $notebooks_dir")
              end

              println("Testing $(length(notebook_files)) notebooks in $notebooks_dir")
              println("="^60)

              errors = []
              for nb_file in notebook_files
                  nb_path = joinpath(notebooks_dir, nb_file)
                  print("Testing $nb_file ... ")
                  try
                      # Run the notebook headlessly
                      session = Pluto.ServerSession()
                      nb = Pluto.load_notebook(Pluto.tamepath(nb_path))
                      # Collect and run all cells
                      cells = nb.cells
                      for (i, cell) in enumerate(cells)
                          if cell.code_folded
                              continue  # skip folded cells
                          end
                          try
                              Pluto.run_cell!(nb, cell)
                          catch e
                              push!(errors, (nb_file, i, e))
                              @warn "Cell $i failed in $nb_file: $e"
                          end
                      end
                      println("✓ OK")
                  catch e
                      push!(errors, (nb_file, 0, e))
                      println("✗ FAILED: $e")
                  end
              end

              println("="^60)
              if isempty(errors)
                  println("All notebooks passed!")
              else
                  println("$(length(errors)) errors:")
                  for (f, c, e) in errors
                      println("  $f (cell $c): $e")
                  end
                  exit(1)
              end
          '

  render-notebooks:
    name: "Render to Static HTML"
    runs-on: ubuntu-latest
    needs: test-notebooks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Install dependencies
        run: |
          julia --project -e '
              using Pkg
              Pkg.instantiate()
          '

      - name: Render notebooks to HTML
        run: |
          julia --project scripts/render.jl

      - name: Upload rendered HTML as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-notebooks
          path: rendered/

  build-docs:
    name: "Build Documentation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Build documentation
        run: |
          julia --project=docs -e '
              using Pkg
              Pkg.develop(PackageSpec(path=pwd()))
              Pkg.instantiate()
              include("docs/make.jl")
          '
        env:
          JULIA_DEBUG: Documenter

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/

  deploy-docs:
    name: "Deploy Documentation"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-notebooks, build-docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
